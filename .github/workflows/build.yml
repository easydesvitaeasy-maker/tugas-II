name: Build C++ to EXE

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Download source code
        uses: actions/checkout@v4

      - name: Setup MinGW compiler
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: mingw-w64-ucrt-x86_64-gcc

      - name: Compile C++ to EXE
        shell: msys2 {0}
        run: |
          g++ -std=c++17 -O2 -static cy.cpp -o cy.exe

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: compiled-exe
          path: cy.exe
          if-no-files-found: error
